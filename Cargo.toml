[package]
name = "slowly"
version = "0.1.0"
edition = "2021"
description = "Coherence Breathing - A Cosmic desktop app for breathing training"
license = "Hippocratic-3.0"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["tokio", "winit", "wgpu"] }
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
diaframe = { git = "https://github.com/daytimeforninja/diaframe.git" }
